[tabs]
shown = true
auto_hide = true
location  = "top" # "top", "bottom", "left", "right"

[hscrollbar]
shown = true
auto_hide = true

[vscrollbar]
shown = true
auto_hide = true

[menubar]
shown = true

[statusbar]
shown = true
location = "bottom" # "top" or "bottom"
filepath_complete = false # Show full file path in statusbar

[minimap]
shown = false
auto_hide = true # Automatically hide minimap when not required
image = true # Show image preview in minimap
size = { width = 200, height = 200 } # Size of the minimap in pixels
image_opacity = 0.75
location = "bottom-right" # "top-left", "top-right", "bottom-left", "bottom-right", "bottom-center", "top-center"
clickable = true # Allow clicking on the minimap to navigate the main view
border_color = "#0000AAA" # Border color of the minimap
border_width = 1
padding = 10

[minimap.overlay]
color = "#44FFFFFF"
border = "#FF5050"
border_width = 20
movable = true # Allow clicking on the minimap overlay to navigate the main view

[rendering]
# Device Pixel Ratio for high-DPI displays; can be a single float value or a map of display names to DPR values
dpr = { "eDP-1" = 1.25, "DP-5" = 1.0, "DP-7" = 1.0 }

[behavior]
auto_reload = true
config_hot_reload = true
keybind_conflict_warning = true
copy_transformed_image = true # Copy the currently viewed (transformed) image when copying instead of the original image

[focus_mode] # Focus mode settings
statusbar_shown = false
menubar_shown = false
tabs_shown = false
hscrollbar_shown = false
vscrollbar_shown = false
minimap_shown = false

[keybindings] # Keybindings settings

### File keybindings
open_file = "o"
close_file = "Ctrl+w"
reload_file = "F5"
open_containing_folder = "Ctrl+Shift+o"

### Copy keybindings
copy_path = "Ctrl+Shift+c"
copy_dir = "Ctrl+Shift+d"
copy_image = "Ctrl+Shift+i"
copy_viewport = "Ctrl+Shift+v"

reset_view = "r"

### Zoom keybindings
zoom_in = "="
zoom_out = "-"
zoom_reset = "0"

### Rotation keybindings
rotate_clock = ">"
rotate_anticlock = "<"

### Scroll keybindings
scroll_left = "h"
scroll_right = "l"
scroll_up = "k"
scroll_down = "j"

### Flip keybindings
flip_horizontal = "Ctrl+h"
flip_vertical = "Ctrl+v"

### Fit keybindings
auto_fit = "Ctrl+Shift+T"
fit_width = "Ctrl+Shift+w"
fit_height = "Ctrl+Shift+h"

### Edge keybindings
left_edge = "Shift+h"
right_edge = "Shift+l"
top_edge = "Shift+k"
bottom_edge = "Shift+j"

### Tab keybindings
tab_next = "Ctrl+Tab"
tab_previous = "Ctrl+Shift+Tab"
tab_1 = "Alt+1"
tab_2 = "Alt+2"
tab_3 = "Alt+3"
tab_4 = "Alt+4"
tab_5 = "Alt+5"
tab_6 = "Alt+6"
tab_7 = "Alt+7"
tab_8 = "Alt+8"
tab_9 = "Alt+9"
tab_last = "Alt+0"

### UI toggle keybindings
toggle_tabs = "Ctrl+t"
toggle_fullscreen = "F11"
toggle_minimap = "m"
toggle_menubar = "Ctrl+Shift+m"
toggle_statusbar = "Ctrl+Shift+s"
toggle_focus_mode = "Ctrl+Space"
